name: PR 3510 Server Image

# Builds the server and frontend images from the phase 1 branch and pushes
# them to the fork's GHCR so the app can be tested against a server that
# carries the session-lifecycle changes (#1995 phase 1).

on:
  workflow_dispatch:
  push:
    branches:
      - ci/pr-3510-e2e
    paths:
      - .github/workflows/pr-3510-server-image.yml
      - SparkyFitnessServer/**
      - shared/**
      - SparkyFitnessFrontend/**
      - ci/pr-3510/**

permissions:
  contents: read
  packages: write

jobs:
  build-push-images:
    name: Build and push phase 1 images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the phase branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ghcr.io/dragonk/sparkyfitness-server:pr-3510

      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ghcr.io/dragonk/sparkyfitness-frontend:pr-3510

