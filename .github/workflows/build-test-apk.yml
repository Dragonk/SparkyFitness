name: Build Test APK

# Fork-only workflow for Dragonk/SparkyFitness.
#
# Builds an installable Android RELEASE APK from any selected branch/tag/SHA.
# The default app variant is "dev", so the APK can coexist with the normal
# production SparkyFitness installation.
#
# This workflow:
# - does NOT use the production signing key,
# - does NOT create tags/releases,
# - does NOT modify the branch being built,
# - uploads the APK as a GitHub Actions artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: true
        default: "feat/mobile-custom-measurements"
        type: string
  app_variant:
    description: "App configuration"
    required: true
    default: "dev"
    type: choice
    options:
      - dev
      - production

  expected_sha:
    description: "Optional exact SHA guard (leave empty to disable)"
    required: false
    default: ""
    type: string
jobs:
build:
name: Build release APK
runs-on: ubuntu-latest
permissions:
  contents: read
env:
  NODE_ENV: production
  APP_VARIANT: ${{ inputs.app_variant }}

steps:
  # ------------------------------------------------------------
  # Checkout exactly the branch/tag/SHA requested by the user.
  # ------------------------------------------------------------

  - name: Checkout target ref
    uses: actions/checkout@v4
    with:
      ref: ${{ inputs.ref }}
      fetch-depth: 0

  - name: Verify checked-out revision
    id: revision
    shell: bash
    run: |
      ACTUAL_SHA="$(git rev-parse HEAD)"
      SHORT_SHA="${ACTUAL_SHA:0:8}"

      echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
      echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      echo "Requested ref: ${{ inputs.ref }}"
      echo "Actual SHA:    $ACTUAL_SHA"

      EXPECTED_SHA="${{ inputs.expected_sha }}"

      if [[ -n "$EXPECTED_SHA" && "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
        echo "::error::Checked-out SHA does not match expected_sha."
        echo "::error::Expected: $EXPECTED_SHA"
        echo "::error::Actual:   $ACTUAL_SHA"
        exit 1
      fi

      if [[ -n "$EXPECTED_SHA" ]]; then
        echo "✅ SHA guard passed"
      fi

  # ------------------------------------------------------------
  # Build environment.
  # Mirrors the normal Android release workflow where appropriate.
  # ------------------------------------------------------------

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Install pnpm
    uses: pnpm/action-setup@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"
      cache: pnpm
      cache-dependency-path: pnpm-lock.yaml

  - name: Install dependencies
    run: pnpm install --frozen-lockfile

  # ------------------------------------------------------------
  # Expo prebuild.
  #
  # APP_VARIANT controls app configuration/package ID.
  # It does NOT control Gradle debug/release mode.
  #
  # We will still build :app:assembleRelease below.
  # ------------------------------------------------------------

  - name: Expo Android prebuild
    working-directory: SparkyFitnessMobile
    run: |
      echo "APP_VARIANT=$APP_VARIANT"
      npx expo prebuild --platform android

  - name: Make Gradle wrapper executable
    run: chmod +x SparkyFitnessMobile/android/gradlew

  - name: Create Android local.properties
    run: |
      echo "sdk.dir=$ANDROID_HOME" > SparkyFitnessMobile/android/local.properties

  # ------------------------------------------------------------
  # Gradle memory configuration.
  #
  # Previous workflow failed in :app:packageRelease with:
  # java.lang.OutOfMemoryError: Java heap space
  #
  # The generated Gradle configuration provided only ~2 GiB heap
  # and 512 MiB metaspace, which was insufficient after the very
  # expensive debug + release sequence.
  #
  # We also limit Gradle worker concurrency to reduce peak memory.
  # ------------------------------------------------------------

  - name: Configure Gradle memory
    shell: bash
    run: |
      GRADLE_PROPERTIES="SparkyFitnessMobile/android/gradle.properties"

      echo "" >> "$GRADLE_PROPERTIES"
      echo "# Fork-only GitHub Actions build overrides" >> "$GRADLE_PROPERTIES"
      echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> "$GRADLE_PROPERTIES"
      echo "org.gradle.workers.max=2" >> "$GRADLE_PROPERTIES"

      echo "Effective GitHub Actions Gradle overrides:"
      tail -n 4 "$GRADLE_PROPERTIES"

  # ------------------------------------------------------------
  # Gradle cache.
  # ------------------------------------------------------------

  - name: Cache Gradle packages
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      restore-keys: |
        ${{ runner.os }}-gradle-

  # ------------------------------------------------------------
  # Temporary signing certificate.
  #
  # Never use the production signing secrets for these test APKs.
  # The keystore exists only for the lifetime of this Actions job.
  # ------------------------------------------------------------

  - name: Generate temporary test keystore
    shell: bash
    run: |
      keytool -genkeypair \
        -v \
        -storetype PKCS12 \
        -keystore "$RUNNER_TEMP/sparky-test.keystore" \
        -alias sparky-test \
        -keyalg RSA \
        -keysize 2048 \
        -validity 3650 \
        -storepass sparky-test-password \
        -keypass sparky-test-password \
        -dname "CN=SparkyFitness Test,O=Dragonk,C=PL"

      test -f "$RUNNER_TEMP/sparky-test.keystore"

  # ------------------------------------------------------------
  # React Native codegen.
  #
  # IMPORTANT:
  # Do NOT run :app:assembleDebug here.
  #
  # The previous workflow spent ~34 minutes compiling a complete
  # debug APK for all native architectures purely as a codegen
  # workaround, and then compiled everything again for release.
  #
  # Generate the AsyncStorage artifacts explicitly instead.
  # Other required codegen tasks remain Gradle dependencies of
  # assembleRelease.
  # ------------------------------------------------------------

  - name: Generate AsyncStorage codegen
    working-directory: SparkyFitnessMobile/android
    run: |
      ./gradlew \
        :react-native-async-storage_async-storage:generateCodegenArtifactsFromSchema \
        --no-daemon \
        --stacktrace

  - name: Verify AsyncStorage codegen
    shell: bash
    run: |
      CODEGEN_DIR="SparkyFitnessMobile/node_modules/@react-native-async-storage/async-storage/android/build/generated/source/codegen/jni"

      if [[ ! -d "$CODEGEN_DIR" ]]; then
        echo "::error::AsyncStorage codegen directory was not generated"
        exit 1
      fi

      echo "✅ AsyncStorage codegen exists"
      ls -la "$CODEGEN_DIR"

  # ------------------------------------------------------------
  # RELEASE BUILD
  #
  # This is the important part:
  #
  # :app:assembleRelease
  #
  # Therefore the resulting APK is a RELEASE build even when
  # APP_VARIANT=dev.
  # ------------------------------------------------------------

  - name: Build Release APK
    working-directory: SparkyFitnessMobile/android
    run: |
      ./gradlew :app:assembleRelease \
        -PMYAPP_RELEASE_STORE_FILE="$RUNNER_TEMP/sparky-test.keystore" \
        -PMYAPP_RELEASE_KEY_ALIAS=sparky-test \
        -PMYAPP_RELEASE_STORE_PASSWORD=sparky-test-password \
        -PMYAPP_RELEASE_KEY_PASSWORD=sparky-test-password \
        --no-daemon \
        --stacktrace

  # ------------------------------------------------------------
  # Locate and verify output.
  # ------------------------------------------------------------

  - name: Locate release APK
    id: apk
    shell: bash
    run: |
      APK_PATH="$(find SparkyFitnessMobile/android/app/build/outputs/apk/release \
        -type f \
        -name '*.apk' \
        | head -n 1)"

      if [[ -z "$APK_PATH" || ! -f "$APK_PATH" ]]; then
        echo "::error::No release APK found"
        exit 1
      fi

      echo "source_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      echo "Generated APK:"
      ls -lh "$APK_PATH"

  - name: Rename APK
    id: output
    shell: bash
    run: |
      SOURCE="${{ steps.apk.outputs.source_path }}"
      SHORT_SHA="${{ steps.revision.outputs.short_sha }}"
      VARIANT="${{ inputs.app_variant }}"

      if [[ "${{ inputs.ref }}" == "feat/mobile-custom-measurements" ]]; then
        FILE_NAME="SparkyFitness-PR2061-${SHORT_SHA}-${VARIANT}-release.apk"
      else
        SAFE_REF="$(echo '${{ inputs.ref }}' | tr '/:' '--')"
        FILE_NAME="SparkyFitness-${SAFE_REF}-${SHORT_SHA}-${VARIANT}-release.apk"
      fi

      OUTPUT_DIR="$RUNNER_TEMP/apk"
      mkdir -p "$OUTPUT_DIR"

      OUTPUT_PATH="$OUTPUT_DIR/$FILE_NAME"
      cp "$SOURCE" "$OUTPUT_PATH"

      SHA256="$(sha256sum "$OUTPUT_PATH" | awk '{print $1}')"

      echo "name=$FILE_NAME" >> "$GITHUB_OUTPUT"
      echo "path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
      echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      echo "APK:    $FILE_NAME"
      echo "SHA256: $SHA256"
      ls -lh "$OUTPUT_PATH"

  - name: Verify APK signature
    shell: bash
    run: |
      APK="${{ steps.output.outputs.path }}"

      if command -v apksigner >/dev/null 2>&1; then
        apksigner verify --verbose "$APK"
      else
        echo "apksigner not available in PATH — skipping extra verification"
      fi

  # ------------------------------------------------------------
  # Artifact.
  # Available from:
  # Actions -> Build Test APK -> run -> Artifacts
  # ------------------------------------------------------------

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: SparkyFitness-${{ steps.revision.outputs.short_sha }}-${{ inputs.app_variant }}-release
      path: ${{ steps.output.outputs.path }}
      if-no-files-found: error
      retention-days: 14
      compression-level: 0

  # ------------------------------------------------------------
  # Human-readable build summary.
  # ------------------------------------------------------------

  - name: Write build summary
    shell: bash
    run: |
      if [[ "${{ inputs.app_variant }}" == "dev" ]]; then
        PACKAGE_ID="org.SparkyApps.SparkyFitnessMobile1.dev"
      else
        PACKAGE_ID="com.SparkyApps.SparkyFitnessMobile"
      fi

      cat >> "$GITHUB_STEP_SUMMARY" <<EOF
      ## SparkyFitness Android test build

      | Field | Value |
      |---|---|
      | Requested ref | \`${{ inputs.ref }}\` |
      | Actual commit | \`${{ steps.revision.outputs.sha }}\` |
      | App variant | \`${{ inputs.app_variant }}\` |
      | Gradle build type | \`release\` |
      | Android package | \`$PACKAGE_ID\` |
      | APK | \`${{ steps.output.outputs.name }}\` |
      | SHA256 | \`${{ steps.output.outputs.sha256 }}\` |
      | Signing | Temporary test keystore |
      | Artifact retention | 14 days |

      ### Important

      This APK was produced using:

      \`\`\`
      :app:assembleRelease
      \`\`\`

      so it is a **release Gradle build**.

      When \`app_variant=dev\`, the separate Android package ID allows it
      to coexist with the normal production SparkyFitness installation.

      The temporary signing key is intentionally different from the
      production release signing key.
      EOF
```
