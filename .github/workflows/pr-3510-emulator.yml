name: PR 3510 Emulator Screenshots

on:
  push:
    branches:
      - ci/pr-3510-e2e
    paths:
      - .github/workflows/pr-3510-emulator.yml
      - ci/pr-3510/**

permissions:
  contents: read

env:
  SPARKY_FITNESS_DB_HOST: localhost
  SPARKY_FITNESS_DB_PORT: "5432"
  SPARKY_FITNESS_DB_NAME: sparkyfitness_db
  SPARKY_FITNESS_DB_USER: sparky
  SPARKY_FITNESS_DB_PASSWORD: sparky-ci-pass
  SPARKY_FITNESS_APP_DB_USER: sparky
  SPARKY_FITNESS_APP_DB_PASSWORD: sparky-ci-pass
  SPARKY_FITNESS_SERVER_PORT: "3010"
  SPARKY_FITNESS_FRONTEND_URL: https://10.0.2.2:8443
  SPARKY_FITNESS_API_ENCRYPTION_KEY: cHIzNTEwLWNpLWVuY3J5cHRpb24ta2V5LTAxMjM0NTY=
  BETTER_AUTH_SECRET: cHItMzUxMC1lbXVsYXRvci1zY3JlZW5zaG90cy1zZWNyZXQhIQ==
  SPARKY_FITNESS_LOG_LEVEL: ERROR
  SPARKY_FITNESS_DISABLE_SIGNUP: "false"
  SPARKY_FITNESS_ADMIN_EMAIL: demo@example.com

jobs:
  emulator-screenshots:
    name: Run the release APK against a live server
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sparkyfitness_db
          POSTGRES_USER: sparky
          POSTGRES_PASSWORD: sparky-ci-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sparky -d sparkyfitness_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the phase branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the API server
        working-directory: SparkyFitnessServer
        run: |
          nohup pnpm exec tsx index.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3010/api/health/ready > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server did not become ready"
          tail -80 /tmp/server.log
          exit 1

      - name: Seed the demo account and sessions
        working-directory: SparkyFitnessServer
        run: pnpm exec tsx ../ci/pr-3510/seed.ts

      - name: Serve the API over HTTPS for the release APK
        run: |
          set -euo pipefail
          # The release build refuses plain http; the emulator reaches the host
          # loopback through 10.0.2.2, so front the API with a self-signed cert.
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 3 \
            -keyout /tmp/sparky-ci.key -out /tmp/sparky-ci.crt \
            -subj "/CN=10.0.2.2" -addext "subjectAltName=IP:10.0.2.2"
          HASH="$(openssl x509 -inform PEM -subject_hash_old -noout -in /tmp/sparky-ci.crt)"
          cp /tmp/sparky-ci.crt "/tmp/${HASH}.0"
          echo "CI_CA_FILE=/tmp/${HASH}.0" >> "$GITHUB_ENV"
          sudo tee /etc/nginx/sites-available/sparky-ci > /dev/null <<'NGINX'
          server {
            listen 8443 ssl;
            server_name 10.0.2.2;
            ssl_certificate /tmp/sparky-ci.crt;
            ssl_certificate_key /tmp/sparky-ci.key;
            location / {
              return 200 'ok';
              add_header Content-Type text/plain;
            }
            location /api/ {
              proxy_pass http://127.0.0.1:3010/api/;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
            }
          }
          NGINX
          sudo ln -sf /etc/nginx/sites-available/sparky-ci /etc/nginx/sites-enabled/sparky-ci
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
          sleep 2
          curl -skf https://127.0.0.1:8443/api/health/ready
          echo
          echo "HTTPS front is up"

      - name: Resolve the APK artifact run
        run: |
          set -euo pipefail
          APK_RUN_ID="$(tr -d '[:space:]' < ci/pr-3510/apk_run_id.txt)"
          case "$APK_RUN_ID" in
            ''|*[!0-9]*) echo "::error::ci/pr-3510/apk_run_id.txt must contain a numeric run id"; exit 1;;
          esac
          echo "APK_RUN_ID=$APK_RUN_ID" >> "$GITHUB_ENV"
          echo "Using APK from run $APK_RUN_ID"

      - name: Wait for the APK build run to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400))
          while :; do
            STATUS="$(gh api repos/Dragonk/SparkyFitness/actions/runs/"$APK_RUN_ID" --jq .status)"
            echo "APK run status: $STATUS"
            if [ "$STATUS" = "completed" ]; then break; fi
            if [ $SECONDS -ge $deadline ]; then echo "::error::Timed out waiting for the APK build run"; exit 1; fi
            sleep 30
          done
          CONCLUSION="$(gh api repos/Dragonk/SparkyFitness/actions/runs/"$APK_RUN_ID" --jq .conclusion)"
          if [ "$CONCLUSION" != "success" ]; then echo "::error::The APK build run concluded with $CONCLUSION"; exit 1; fi
      - name: Download the APK artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.APK_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Run the emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            set -euo pipefail
            adb root
            adb wait-for-device
            # Trust the CI CA as a system certificate so the app accepts the
            # self-signed TLS front. Push before the app's first launch.
            adb remount || {
              adb disable-verity
              adb reboot
              adb wait-for-device
              adb root
              sleep 5
              adb remount
            }
            adb push "$CI_CA_FILE" /system/etc/security/cacerts/
            adb shell "ls /system/etc/security/cacerts/ | wc -l"

            APK="$(find "$PWD/apk" -name '*.apk' -type f | head -n 1)"
            echo "Installing $APK"
            adb install -r "$APK"

            curl -fsSL "https://get.maestro.mobile.dev" | bash
            export PATH="$HOME/.maestro/bin:$PATH"
            maestro --version

            cd ci/pr-3510
            maestro test flow.yaml -e APP_ID=org.SparkyApps.SparkyFitnessMobile1.dev -o "$GITHUB_WORKSPACE/maestro-out"

            mkdir -p "$GITHUB_WORKSPACE/screenshots"
            find "$GITHUB_WORKSPACE/maestro-out" -name "*.png" | xargs -I{} cp -v {} "$GITHUB_WORKSPACE/screenshots/"

            # screenshots land in maestro-out via -o

      - name: Always collect screenshots and logs
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d maestro-out ]; then find maestro-out -name "*.png" | xargs -I{} cp -v {} screenshots/; fi
          if [ -d ci/pr-3510 ]; then cp -v ci/pr-3510/*.png screenshots/ 2>/dev/null || true; fi
          ls -la screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-3510-screenshots
          path: screenshots/
          retention-days: 14

      - name: Dump server log on failure
        if: failure()
        run: tail -100 /tmp/server.log || true

