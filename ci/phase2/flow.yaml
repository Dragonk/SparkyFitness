appId: ${APP_ID}
name: Phase 2 workout plan management screenshots
---
- launchApp:
    appId: ${APP_ID}
    clearState: true
- extendedWaitUntil:
    visible: "Frontend URL"
    timeout: 90000
# The URL input sits directly below its label, ahead of the paste button.
- tapOn:
    below:
      text: "Frontend URL"
    index: 0
- inputText: "https://10.0.2.2:8443"
- hideKeyboard
- takeScreenshot: 01_onboarding
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Connect to SparkyFitness"
    timeout: 45000
- takeScreenshot: 02_sign_in
# Email and Password inputs sit right below their static labels.
- tapOn:
    below:
      text: "Email"
    index: 0
- inputText: "demo@example.com"
- hideKeyboard
- tapOn:
    below:
      text: "Password"
    index: 0
- inputText: "SparkyDemo2026!"
- hideKeyboard
- takeScreenshot: 02_sign_in_filled
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "Diary"
    timeout: 90000
- takeScreenshot: 03_after_login
# The workout plans entry lives in the Library tab.
- tapOn: "Library"
- extendedWaitUntil:
    visible: "Workout plans"
    timeout: 45000
- takeScreenshot: 04_library
- tapOn: "Workout plans"
- extendedWaitUntil:
    visible: "Phase 2 Weekly Plan"
    timeout: 45000
- takeScreenshot: 05_plans_list
# Detail: day section, assignments, set summaries, activation switch.
- tapOn: "Phase 2 Weekly Plan"
- extendedWaitUntil:
    visible: "Active plan"
    timeout: 45000
- scrollUntilVisible:
    element:
      text: "Phase 2 Push Day"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 80
- takeScreenshot: 06_plan_detail
# Deactivate through the detail switch. index 1 skips the 'Active plan'
# title text that sits in the same row.
- scrollUntilVisible:
    element:
      text: "Active plan"
    direction: UP
    timeout: 30000
    visibilityPercentage: 80
- tapOn:
    text: "Active plan"
    index: 1
- extendedWaitUntil:
    visible: "Plan deactivated"
    timeout: 30000
- takeScreenshot: 07_plan_deactivated
# Edit the plan: add a single exercise with its own sets.
- tapOn: "Edit workout plan"
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 45000
- scrollUntilVisible:
    element:
      text: "Add exercise"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 80
- tapOn: "Add exercise"
# The search field has no text Maestro can match (placeholders are
# invisible), so tap it by position: the EditText sits just under the
# Search/Online tab row (bounds captured from a debug dump).
- tapOn:
    point: "51%, 8%"
- inputText: "Demo Goblet"
- hideKeyboard
- extendedWaitUntil:
    visible: "Demo Goblet Squat"
    timeout: 45000
- tapOn: "Demo Goblet Squat"
- extendedWaitUntil:
    visible: "Add set"
    timeout: 45000
- takeScreenshot: 08_form_exercise_added
- tapOn:
    text: "zz_probe_marker_never_matches"
    optional: true
# The optional probe above never matches; its failure dump captures the
# form hierarchy with the set row coordinates.
# The set inputs sit in one row (reps, weight, rest) at the coordinates
# captured from the accessibility hierarchy on the 1080x1920 skin:
# reps [59,1074][377,1116], weight [382,1074][700,1116], rest
# [706,1074][1024,1116]. Selector combos (rightOf/below/index) matched the
# reorder and remove buttons instead - their accessibility labels contain
# the exercise name - so the flow moved the assignments around and even
# removed the exercise from the draft. Tap the exact screen points instead.
# Each tap focuses a real input, so the IME opens and hideKeyboard
# (BACK) safely closes it between the fields.
- tapOn:
    point: "20%, 57%"
- inputText: "12"
- hideKeyboard
- tapOn:
    point: "50%, 57%"
- inputText: "20"
- hideKeyboard
- tapOn:
    point: "80%, 57%"
- inputText: "90"
- hideKeyboard
- takeScreenshot: 09_set_filled
# Save; the plan is inactive for now, so nothing regenerates yet.
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Active plan"
    timeout: 45000
- scrollUntilVisible:
    element:
      text: "Demo Goblet Squat"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 80
- takeScreenshot: 10_detail_after_edit
# Reactivate: the server regenerates the upcoming planned sessions.
- scrollUntilVisible:
    element:
      text: "Active plan"
    direction: UP
    timeout: 30000
    visibilityPercentage: 80
- tapOn:
    text: "Active plan"
    index: 1
- extendedWaitUntil:
    visible: "Plan activated"
    timeout: 30000
- takeScreenshot: 11_reactivated

