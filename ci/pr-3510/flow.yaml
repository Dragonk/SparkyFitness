appId: ${APP_ID}
name: PR 3510 session lifecycle screenshots
---
# The URL input exposes only a paste affordance to accessibility (its hint is
# not in the tree), so seed the clipboard and paste instead of typing.
- launchApp:
    appId: ${APP_ID}
    clearState: true
- extendedWaitUntil:
    visible: "Frontend URL"
    timeout: 90000
- takeScreenshot: 01_onboarding
- setClipboard: "https://10.0.2.2:8443"
- tapOn: "Paste URL from clipboard"
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Connect to SparkyFitness"
    timeout: 45000
- takeScreenshot: 02_sign_in
# Email and Password inputs sit right below their static labels.
- tapOn:
    below:
      text: "Email"
- inputText: "demo@example.com"
- tapOn:
    below:
      text: "Password"
- inputText: "SparkyDemo2026!"
- hideKeyboard
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "Diary"
    timeout: 90000
- takeScreenshot: 03_after_login
# Diary: sessions with their derived status pills.
- tapOn:
    text: "Diary"
    index: 1
- extendedWaitUntil:
    visible: "Phase 1 Partial Workout"
    timeout: 45000
- scrollUntilVisible:
    element:
      text: "Phase 1 Partial Workout"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 80
- takeScreenshot: 04_diary_status_pills
# Detail: status badge and the Resume button on a partial session.
- tapOn: "Phase 1 Partial Workout"
- extendedWaitUntil:
    visible: "Partial"
    timeout: 45000
- takeScreenshot: 05_detail_partial
- tapOn: "Resume Workout"
- extendedWaitUntil:
    visible: "Demo Goblet Squat"
    timeout: 60000
- takeScreenshot: 06_active_workout_resumed
