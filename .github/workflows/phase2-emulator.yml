name: Phase 2 Emulator Screenshots

on:
  push:
    branches:
      - ci/phase2-e2e
    paths:
      - .github/workflows/phase2-emulator.yml
      - ci/phase2/**

permissions:
  contents: read

env:
  SPARKY_FITNESS_DB_HOST: localhost
  SPARKY_FITNESS_DB_PORT: "5432"
  SPARKY_FITNESS_DB_NAME: sparkyfitness_db
  SPARKY_FITNESS_DB_USER: sparky
  SPARKY_FITNESS_DB_PASSWORD: sparky-ci-pass
  SPARKY_FITNESS_APP_DB_USER: sparky
  SPARKY_FITNESS_APP_DB_PASSWORD: sparky-ci-pass
  SPARKY_FITNESS_SERVER_PORT: "3010"
  SPARKY_FITNESS_FRONTEND_URL: https://10.0.2.2:8443
  SPARKY_FITNESS_API_ENCRYPTION_KEY: cHIzNTEwLWNpLWVuY3J5cHRpb24ta2V5LTAxMjM0NTY=
  BETTER_AUTH_SECRET: cHItMzUxMC1lbXVsYXRvci1zY3JlZW5zaG90cy1zZWNyZXQhIQ==
  SPARKY_FITNESS_LOG_LEVEL: INFO
  SPARKY_FITNESS_DISABLE_SIGNUP: "false"
  SPARKY_FITNESS_ADMIN_EMAIL: demo@example.com

jobs:
  emulator-screenshots:
    name: Run the release APK against a live server
    runs-on: ubuntu-latest
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sparkyfitness_db
          POSTGRES_USER: sparky
          POSTGRES_PASSWORD: sparky-ci-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sparky -d sparkyfitness_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the phase branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Keep the upstream announcement modal out of the screenshots
        # The server proxies the upstream announcement feed; pointing its
        # host at loopback makes the fetch fail so the app never shows the
        # full-screen announcement modal over the demo screens.
        run: echo "127.0.0.1 raw.githubusercontent.com" | sudo tee -a /etc/hosts

      - name: Start the API server
        working-directory: SparkyFitnessServer
        run: |
          nohup pnpm exec tsx index.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3010/api/health/ready > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server did not become ready"
          tail -80 /tmp/server.log
          exit 1

      - name: Seed the demo account and sessions
        working-directory: SparkyFitnessServer
        run: pnpm exec tsx ../ci/phase2/seed.ts

      - name: Serve the API over HTTPS for the release APK
        run: |
          set -euo pipefail
          # The release build refuses plain http; the emulator reaches the host
          # loopback through 10.0.2.2, so front the API with a self-signed cert.
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 3 \
            -keyout /tmp/sparky-ci.key -out /tmp/sparky-ci.crt \
            -subj "/CN=10.0.2.2" -addext "subjectAltName=IP:10.0.2.2"
          HASH="$(openssl x509 -inform PEM -subject_hash_old -noout -in /tmp/sparky-ci.crt)"
          cp /tmp/sparky-ci.crt "/tmp/${HASH}.0"
          echo "CI_CA_FILE=/tmp/${HASH}.0" >> "$GITHUB_ENV"
          sudo tee /etc/nginx/sites-available/sparky-ci > /dev/null <<'NGINX'
          server {
            listen 8443 ssl;
            server_name 10.0.2.2;
            ssl_certificate /tmp/sparky-ci.crt;
            ssl_certificate_key /tmp/sparky-ci.key;
            location / {
              return 200 'ok';
              add_header Content-Type text/plain;
            }
            location /api/ {
              proxy_pass http://127.0.0.1:3010/api/;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
            }
          }
          NGINX
          sudo ln -sf /etc/nginx/sites-available/sparky-ci /etc/nginx/sites-enabled/sparky-ci
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
          sleep 2
          curl -skf https://127.0.0.1:8443/api/health/ready
          echo
          echo "HTTPS front is up"

      - name: Resolve and wait for the matching APK build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The APK is built from the phase branch by the push-triggered
          # phase2-apk workflow; wait until its artifact carries the current
          # phase head so the screenshots always match the branch tip.
          FEATURE_SHA="$(gh api repos/Dragonk/SparkyFitness/commits/feat/workout-plan-mobile-management --jq .sha)"
          SHORT="${FEATURE_SHA:0:8}"
          echo "Phase head: $FEATURE_SHA (short $SHORT)"
          # The mobile code changed in 1caeb59f, so only an APK built from the
          # current head is acceptable; keep the fallback equal to the head.
          FALLBACK_SHORT="1caeb59f"
          deadline=$((SECONDS + 2700))
          while :; do
            for RID in $(gh api "repos/Dragonk/SparkyFitness/actions/workflows/phase2-apk.yml/runs?status=success&per_page=10" --jq '.workflow_runs[].id'); do
              NAME="$(gh api repos/Dragonk/SparkyFitness/actions/runs/$RID/artifacts --jq '.artifacts[0].name')"
              echo "run $RID artifact: $NAME"
              if [ "$NAME" = "SparkyFitness-$SHORT-dev-release-dualabi" ] || [ "$NAME" = "SparkyFitness-$FALLBACK_SHORT-dev-release-dualabi" ]; then
                echo "APK_RUN_ID=$RID" >> "$GITHUB_ENV"
                echo "Using APK from run $RID"
                exit 0
              fi
            done
            if [ $SECONDS -ge $deadline ]; then echo "::error::Timed out waiting for an APK artifact for $SHORT"; exit 1; fi
            sleep 45
          done

      - name: Download the APK artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.APK_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Grant KVM access to the runner user
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm missing; the emulator will fall back to software emulation"
          fi

      - name: Run the emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -writable-system -camera-back none -memory 3072 -skin 1080x1920
          disable-animations: false
          script: bash ci/phase2/emulator-test.sh

      - name: Always collect screenshots and logs
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d "$HOME/.maestro/tests" ]; then find "$HOME/.maestro/tests" -type f | xargs -I{} cp -v {} screenshots/; fi
          if [ -d maestro-out ]; then find maestro-out -name "*.png" | xargs -I{} cp -v {} screenshots/; fi
          if [ -d ci/phase2 ]; then cp -v ci/phase2/*.png screenshots/ 2>/dev/null || true; fi
          ls -la screenshots || true
          # Ground truth for the plan state after the flow: dump the plan
          # templates straight from the API with the seeded demo account.
          TOKEN="$(curl -s -X POST http://127.0.0.1:3010/api/auth/sign-in/email -H 'Origin: https://10.0.2.2:8443' -H 'Content-Type: application/json' -d '{"email":"demo@example.com","password":"SparkyDemo2026!"}' | jq -r .token)"
          echo "--- plan templates after the flow ---"
          curl -s http://127.0.0.1:3010/api/workout-plan-templates -H "Authorization: Bearer $TOKEN" | jq '.' || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-screenshots
          path: screenshots/
          retention-days: 14

      - name: Dump server log
        if: always()
        run: tail -400 /tmp/server.log || true

